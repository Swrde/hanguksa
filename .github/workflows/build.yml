name: 앱 만들기

on:
  push:
    branches: [ main ]
    # 공부 내용(study.html)만 바꾼 경우는 앱이 알아서 받아 가므로 새 APK를 만들지 않아요
    paths-ignore:
      - 'study.html'
      - 'app/src/main/assets/study.html'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 폰에서도 올릴 수 있게: 저장소에 app.zip을 올리면 여기서 풀고, 맨 위의 study.html을 앱 안에 넣어요
      - name: app.zip 풀기
        run: |
          if [ -f app.zip ]; then
            rm -rf /tmp/z && mkdir -p /tmp/z && unzip -q -o app.zip -d /tmp/z
            d=$(dirname "$(find /tmp/z -name settings.gradle | head -1)")
            cp -r "$d"/. .
          fi
          if [ -f study.html ]; then cp study.html app/src/main/assets/study.html; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 문제 데이터 만들기
        run: python3 tools/make_quiz_json.py

      - name: APK 만들기
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 파일 이름 정리
        run: |
          cp app/build/outputs/apk/release/app-release.apk studynote-v1.${{ github.run_number }}.apk
          # 앱이 새 버전을 알아보는 파일 (앱 안에서 바로 업데이트할 때 써요)
          printf '{"code":%s,"name":"1.%s","tag":"v1.%s","apk":"studynote-v1.%s.apk"}\n' \
            ${{ github.run_number }} ${{ github.run_number }} ${{ github.run_number }} ${{ github.run_number }} > version.json
          cat version.json

      - name: 릴리스로 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: 한국사 잠금퀴즈 v1.${{ github.run_number }}
          body: 앱을 열면 새 버전을 알려 주고 앱 안에서 바로 업데이트돼요. 처음 한 번만 아래 Assets에서 APK를 받아 설치하세요.
          make_latest: true
          files: |
            studynote-v1.${{ github.run_number }}.apk
            version.json
