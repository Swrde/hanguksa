name: 앱 만들기

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: 압축 풀고 APK 만들기
        run: |
          ZIP=$(ls *.zip | head -1)
          unzip -q "$ZIP" -d src
          cd src/HanguksaQuiz
          python3 tools/make_quiz_json.py
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/한국사잠금퀴즈-v1.${{ github.run_number }}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: 한국사 잠금퀴즈 v1.${{ github.run_number }}
          body: 아래 Assets에서 APK를 눌러 받아 설치하세요.
          files: 한국사잠금퀴즈-v1.${{ github.run_number }}.apk
